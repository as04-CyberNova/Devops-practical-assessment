apiVersion: v1
kind: Service
metadata:
  name: edupulse-service
spec:
  type: LoadBalancer
  selector:
    app: edupulse
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
