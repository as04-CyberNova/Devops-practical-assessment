apiVersion: apps/v1
kind: Deployment
metadata:
  name: edupulse-app
  labels:
    app: edupulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edupulse
  template:
    metadata:
      labels:
        app: edupulse
    spec:
      containers:
      - name: edupulse
        image: edupulse:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: MONGO_URI
          value: "mongodb://mongo:27017/edupulse"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        emptyDir: {}
